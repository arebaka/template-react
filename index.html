<!doctype html>
<html lang="en" prefix="og: http://ogp.me/ns# video: http://ogp.me/ns/video#">
<head>
	<title>{title}</title>
	<base href="/" />
	<meta charset="UTF-8" />

	<meta name="robots" content="all" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
	<meta name="format-detection" content="telephone=no, address=no, email=no" />
	<meta name="description" content="{description}" />
	<meta name="author" content="arelive" />
	<meta name="keywords" content="{keywords}" />
	<meta name="rating" content="general" />
	<meta name="referrer" content="no-referrer" />
	<meta name="application-name" content="{title}" />

	<meta name="theme-color" content="#2d2d2d" />
	<meta name="msapplication-TileColor" content="#2d2d2d" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-title" content="{title}" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

	<meta property="og:title" content="Console Kitchen" />
	<meta property="og:description" content="{description}" />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="{uri}" />
	<meta property="og:image" content="" />
	<meta property="og:image:secure_url" content="{image}" />
	<meta property="og:image:type" content="image/png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="630" />
	<meta property="og:image:alt" content="cover" />
	<meta property="og:site_name" content="{title}" />
	<meta property="og:locale" content="en_US" />
	<meta property="og:locale:alternate" content="ru_RU" />
	<meta property="og:locale:alternate" content="uk_UA" />

	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:site" content="@ctreyls" />
	<meta name="twitter:creator" content="@ctreyls" />
	<meta name="twitter:title" content="{title}" />
	<meta name="twitter:description" content="{description}" />
	<meta name="twitter:image" content="{image}" />
	<meta name="twitter:image:alt" content="cover" />

	<link rel="icon" href="favicon.ico" type="image/x-icon" />
	<link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
	<link rel="mask-icon" href="/assets/icon.svg" color="#2d2d2d" />
	<link rel="apple-touch-icon" href="/assets/icon.png" sizes="192x192" />

	<link rel="canonical" href="{uri}" />
	<link rel="alternate" hreflang="x-default" href="{uri}" />
	<link rel="license" href="https://opensource.org/license/mit" />
	<link rel="me" href="https://t.me/arelive" />
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>
</html>
